name: Build and Package SDK (artifact-only)

# Artifact-only: builds and packs the SDK and uploads the .nupkg as a workflow
# artifact. NO automatic push to NuGet or GitHub Packages (no-deploy constraint,
# issue #3). Publishing is manual/opt-in and never auto-runs on push.
on:
  push:
    tags:
      - 'v*'              # Triggers on tags like v1.0.0, v0.0.4
  workflow_dispatch:      # Manual trigger

jobs:
  publish-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version from VERSION.txt
        id: version
        run: |
          VERSION=$(cat VERSION.txt | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Display version
        run: echo "Building SDK version ${{ steps.version.outputs.VERSION }}"

      - name: Restore
        run: dotnet restore src/Razor.Core.Sdk/Razor.Core.Sdk.csproj

      - name: Build
        run: dotnet build src/Razor.Core.Sdk/Razor.Core.Sdk.csproj --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/Razor.Core.Sdk/Razor.Core.Sdk.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkg \
            /p:Version=${{ steps.version.outputs.VERSION }}

      # Artifact-only: publish the packed .nupkg as a workflow artifact.
      # No automatic push to NuGet or GitHub Packages (no-deploy constraint).
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: razor-sdk-${{ steps.version.outputs.VERSION }}
          path: ./nupkg/*.nupkg