name: Build and Package Engine (artifact-only)

# Artifact-only: builds and packages the Engine and uploads it as a workflow
# artifact. NO deploy step and NO push to any registry (no-deploy constraint,
# issue #3). Publishing is manual/opt-in.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-engine:
    runs-on: windows-latest   # Engine needs Windows build for obfuscation
    
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: windows-latest
            runtime: win-x64
            output: Razor.Engine.exe
          - os: ubuntu-latest
            runtime: linux-x64
            output: Razor.Engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION.txt | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Restore
        run: dotnet restore src/Razor.Core.Engine/Razor.Core.Engine.csproj

      - name: Build
        run: dotnet build src/Razor.Core.Engine/Razor.Core.Engine.csproj --configuration Release --no-restore

      - name: Publish for ${{ matrix.os }}
        run: |
          dotnet publish src/Razor.Core.Engine/Razor.Core.Engine.csproj \
            --configuration Release \
            --runtime ${{ matrix.runtime }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            --output ./publish/${{ matrix.runtime }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: razor-engine-${{ matrix.runtime }}-${{ steps.version.outputs.VERSION }}
          path: ./publish/${{ matrix.runtime }}