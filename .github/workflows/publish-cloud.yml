name: Deploy Cloud

on:
  push:
    branches: [main]
    paths:
      - 'src/Razor.Cloud/**'
      - 'src/Razor.Core.Sdk/**'   # If SDK changes, rebuild Cloud
  workflow_dispatch:

jobs:
  deploy-cloud:
    runs-on: ubuntu-latest
    # Cloud deployment is disabled until src/Razor.Cloud exists. Gate the job so
    # it does not silently report success on every main push; it only runs for
    # manual workflow_dispatch. See issue #3 (audit) for the Razor.Cloud roadmap.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION.txt | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cloud deploy disabled
        run: |
          echo "::notice::Cloud deployment is intentionally DISABLED. src/Razor.Cloud does not yet exist."
          echo "::notice::This job runs only on manual workflow_dispatch. Nothing is built or deployed."
          if [ -d "src/Razor.Cloud" ]; then
            echo "::error::src/Razor.Cloud now exists; enable the real deploy steps in publish-cloud.yml."
            exit 1
          fi
          echo "::notice::Verification passed: no src/Razor.Cloud project present, deploy correctly disabled."
        shell: bash

      # TODO: enable when src/Razor.Cloud is added
