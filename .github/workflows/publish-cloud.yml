name: Deploy Cloud

# Cloud deploy is DISABLED (no Azure / no prod). This workflow is kept
# solely so the workflow list is stable, but it can NEVER deploy.
# Manual only — never auto on push. See issue #3 (no-deploy constraint).
on:
  workflow_dispatch:

jobs:
  deploy-cloud:
    runs-on: ubuntu-latest
    # Cloud deployment is disabled. src/Razor.Cloud does not exist and no
    # Azure deploy target is configured. This job only echoes a skip message.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION.txt | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build and publish Razor.Cloud
        run: |
          echo "Cloud deploy is disabled (no Azure, no prod). See issue #3."
          echo "Razor.Cloud project does not exist yet. Skipping build, publish, and deploy."

      # Cloud deploy is intentionally disabled. No Azure / prod / deploy steps
      # exist and none will ever be added under the no-deploy constraint (#3).
