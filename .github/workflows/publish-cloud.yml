name: Deploy Cloud

on:
  push:
    branches: [main]
    paths:
      - 'src/Razor.Core.Sdk/**'   # If SDK changes, rebuild Cloud
  workflow_dispatch:

jobs:
  deploy-cloud:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION.txt | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build and publish Razor.Cloud
        run: |
          echo "Razor.Cloud project does not exist yet. Skipping build and publish."

