name: build-and-test

on:
    push:
        branches: [dev]
        tags: ['v*']
    pull_request:
        branches: [prod]

env:
    DOTNET_VERSION: '9.0.x'

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            # ------------------------------------------------------------------
            # Code style check – strict .editorconfig enforcement
            # ------------------------------------------------------------------
            - name: Code style check
              run: dotnet format --verify-no-changes --severity error

            # ------------------------------------------------------------------
            # Build feed URL from GIT_API_URL and replace placeholder in nuget.config
            # ------------------------------------------------------------------
            - name: Prepare nuget.config
              shell: bash
              run: |
                  FEED_URL="${{ secrets.GIT_API_URL }}/api/packages/Chronos/nuget/index.json"
                  sed -i "s|https://your-gitea-domain/api/packages/Chronos/nuget/index.json|${FEED_URL}|g" nuget.config

            # ------------------------------------------------------------------
            # Decode strong‑name key from secret
            # ------------------------------------------------------------------
            - name: Restore strong‑name key
              shell: bash
              run: |
                  echo "${{ secrets.STRONG_NAME_KEY }}" | base64 -d > ${{ runner.temp }}/chronos.snk
                  echo "SNK_PATH=${{ runner.temp }}/chronos.snk" >> $GITHUB_ENV

            - name: Restore dependencies
              run: dotnet restore --configfile nuget.config

            - name: Build
              run: >
                  dotnet build --no-restore --configuration Release
                  -p:ContinuousIntegrationBuild=true
                  -p:SignAssembly=true
                  -p:AssemblyOriginatorKeyFile=${{ env.SNK_PATH }}

            - name: Test
              run: dotnet test --no-build --configuration Release --verbosity normal

            - name: Run determinism golden tests
              run: dotnet test tests/Chronos.Determinism.Tests/ --no-build --configuration Release --filter "Category=Determinism"

            # ------------------------------------------------------------------
            # Version determination
            # ------------------------------------------------------------------
            - name: Read base version
              id: base_version
              shell: bash
              run: echo "value=$(cat VERSION.txt | tr -d '\n\r ')" >> $GITHUB_OUTPUT

            - name: Determine final version
              id: version
              shell: bash
              run: |
                  BASE="${{ steps.base_version.outputs.value }}"
                  if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
                    VERSION="${GITHUB_REF#refs/tags/v}"
                  else
                    VERSION="${BASE}-dev.$(date +%Y%m%d).${{ github.run_number }}"
                  fi
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "is_stable=$([[ '${{ github.ref }}' == refs/tags/v* ]] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

            # ------------------------------------------------------------------
            # Pack both packages
            # ------------------------------------------------------------------
            - name: Pack Chronos.Abstractions
              run: >
                  dotnet pack src/Chronos.Abstractions/Chronos.Abstractions.csproj
                  --no-build --configuration Release
                  -p:PackageVersion=${{ steps.version.outputs.version }}
                  -p:SignAssembly=true
                  -p:AssemblyOriginatorKeyFile=${{ env.SNK_PATH }}
                  --output ./nupkgs

            - name: Pack Chronos.Kernel
              run: >
                  dotnet pack src/Chronos.Kernel/Chronos.Kernel.csproj
                  --no-build --configuration Release
                  -p:PackageVersion=${{ steps.version.outputs.version }}
                  -p:SignAssembly=true
                  -p:AssemblyOriginatorKeyFile=${{ env.SNK_PATH }}
                  --output ./nupkgs

            # ------------------------------------------------------------------
            # Verify package integrity
            # ------------------------------------------------------------------
            - name: Verify NuGet packages
              shell: bash
              run: |
                  for pkg in ./nupkgs/*.nupkg; do
                    dotnet nuget verify "$pkg"
                  done

            # ------------------------------------------------------------------
            # Publish to Gitea NuGet (always for dev and tags)
            # ------------------------------------------------------------------
            - name: Publish to Gitea NuGet
              if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
              run: |
                  FEED_URL="${{ secrets.GIT_API_URL }}/api/packages/Chronos/nuget/index.json"
                  dotnet nuget push ./nupkgs/*.nupkg \
                    --source "${FEED_URL}" \
                    --api-key ${{ secrets.LOCAL_NUGET_API_KEY }} \
                    --skip-duplicate

            # ------------------------------------------------------------------
            # Publish Chronos.Abstractions to nuget.org (stable tags only)
            # ------------------------------------------------------------------
            - name: Publish Chronos.Abstractions to nuget.org
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  dotnet nuget push ./nupkgs/Chronos.Abstractions.*.nupkg \
                    --source https://api.nuget.org/v3/index.json \
                    --api-key ${{ secrets.NUGET_ORG_API_KEY }}

            # ------------------------------------------------------------------
            # Trigger downstream repositories (dev branch only)
            # ------------------------------------------------------------------
            - name: Trigger downstream repos
              if: github.ref == 'refs/heads/dev'
              run: |
                  for repo in chronos-services chronos-samples; do
                    curl -s -X POST \
                      -H "Authorization: token ${{ secrets.CROSS_REPO_TRIGGER_TOKEN }}" \
                      -H "Content-Type: application/json" \
                      "${{ secrets.GIT_API_URL }}/api/v1/repos/Chronos/$repo/dispatches" \
                      -d '{"event_type":"upstream-core-updated"}'
                  done
